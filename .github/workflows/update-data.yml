name: Update economic data

on:
  schedule:
    # 13:20 UTC on the 1st and 15th of every month (after most BLS/BEA morning releases).
    - cron: "20 13 1,15 * *"
  workflow_dispatch: {}      # the "Refresh data now" button in the GitHub Actions tab
  push:
    branches: [main]
    paths: [catalog.json, scripts/**, .github/workflows/update-data.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch every series in catalog.json from FRED
        run: python3 scripts/fetch_fred.py
      - name: Commit refreshed data
        run: |
          git config user.name "econ-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No data changes" || git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
